# Litestream configuration for the Aumohta server image. Litestream expands
# ${VAR} references from the environment when it loads this file; the
# entrypoint only uses it when AUMOHTA_LITESTREAM_REPLICA_URL is set.
# S3 credentials come from the AWS default chain (env vars, ECS task role, ...).
dbs:
  - path: ${AUMOHTA_DATABASE_PATH}
    replica:
      url: ${AUMOHTA_LITESTREAM_REPLICA_URL}
